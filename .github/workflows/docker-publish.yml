name: Build and Publish Docker Image

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image manually
        run: |
          # Force the repository name to strictly lowercase to satisfy Docker requirements
          IMAGE_ID=$(echo "${{ github.repository }}" | tr '[A-Z]' '[a-z]')
          
          # Run standard docker build targeting the current directory
          docker build -t $REGISTRY/$IMAGE_ID:master .
          
          # Push the compiled image up to the GitHub Container Registry
          docker push $REGISTRY/$IMAGE_ID:master
